name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Activity Graph SVG
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=y-lebid&theme=react-dark&hide_border=true&bg_color=0d1117" -o profile-activity.svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-activity.svg
          git commit -m "Update activity graph" || exit 0
          git push
